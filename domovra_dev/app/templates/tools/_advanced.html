<h2>Avancés</h2>

<div class="row">
  <div class="field">
    <label style="display:flex;align-items:center;gap:.5rem">
      <input type="checkbox" name="enable_off_block" {{ 'checked' if SETTINGS.enable_off_block|default(true) }}>
      Afficher le bloc Open Food Facts sur "Fiche produit"
    </label>
  </div>
  <div class="field">
    <label style="display:flex;align-items:center;gap:.5rem">
      <input type="checkbox" name="enable_scanner" {{ 'checked' if SETTINGS.enable_scanner|default(true) }}>
      Activer le scanner caméra (BarcodeDetector/ZXing)
    </label>
  </div>
  <div class="field">
    <label style="display:flex;align-items:center;gap:.5rem">
      <input type="checkbox" name="ha_notifications" {{ 'checked' if SETTINGS.ha_notifications }}>
      Activer les notifications Home Assistant
    </label>
  </div>
</div>

<hr style="border:none;border-top:1px solid var(--line);margin:18px 0 14px">

<h3 style="margin:0 0 12px;font-size:1rem">🖨️ Imprimante d'étiquettes BLE</h3>

<div class="row">
  <div class="field">
    <label style="display:flex;align-items:center;gap:.5rem">
      <input type="checkbox" name="printer_enabled" id="printer_enabled"
             {{ 'checked' if SETTINGS.printer_enabled }}
             onchange="document.getElementById('printer-config').hidden = !this.checked">
      Activer l'impression d'étiquettes (Phomemo M110 ou compatible)
    </label>
  </div>
</div>

<div id="printer-config" {{ 'hidden' if not SETTINGS.printer_enabled }}>
  <div class="row" style="margin-top:10px">
    <div class="field">
      <div class="label">Adresse MAC Bluetooth de l'imprimante</div>
      <input type="text" name="printer_mac"
             value="{{ SETTINGS.printer_mac|default('') }}"
             placeholder="ex : 7C:91:7B:E4:6B:49"
             pattern="^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$"
             title="Format : XX:XX:XX:XX:XX:XX">
      <div class="label" style="margin-top:4px;font-size:11px">
        Trouvable dans HA → Paramètres → Appareils &amp; Services → Bluetooth → Annonces
      </div>
    </div>
    <div class="field" style="display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap">
      <button type="button" class="btn secondary" id="btn-print-test" onclick="printerAction('print')">
        🖨️ Imprimer une étiquette de test
      </button>
      <button type="button" class="btn ghost" id="btn-preview-test" onclick="printerAction('preview')">
        👁 Prévisualiser
      </button>
      <button type="button" class="btn ghost" id="btn-diag" onclick="printerAction('diag')"
              title="Diagnostic complet BLE : interfaces HCI, D-Bus, connexions L2CAP, commandes BT">
        🩺 Diagnostic BLE
      </button>
    </div>
  </div>

  <div id="preview-container" hidden style="margin-top:12px;text-align:center">
    <div class="label" style="margin-bottom:6px">Aperçu de l'étiquette :</div>
    <img id="preview-img" src="" alt="Aperçu étiquette"
         style="max-width:384px;border:1px solid var(--line);border-radius:8px;background:#fff">
  </div>

  <div id="diag-result" hidden style="margin-top:12px;background:var(--surface2,#1e1e2e);border-radius:8px;padding:12px">
    <div class="label" style="margin-bottom:6px">Résultat diagnostic BLE :</div>
    <pre id="diag-pre" style="font-size:11px;overflow-x:auto;margin:0;white-space:pre-wrap;word-break:break-all;max-height:400px;overflow-y:auto"></pre>
  </div>

  <div id="printer-status" style="margin-top:8px;font-size:13px"></div>
</div>

<script>
(function () {
  var BASE = '{{ BASE }}';

  function setStatus(msg, ok) {
    var el = document.getElementById('printer-status');
    if (!el) return;
    el.textContent = msg;
    el.style.color = ok ? 'var(--toast-ok, #4caf50)' : 'var(--toast-error, #ef5350)';
  }

  async function safeJson(response) {
    var text = await response.text();
    try { return { parsed: JSON.parse(text), raw: text }; }
    catch (_) { return { parsed: null, raw: text }; }
  }

  window.printerAction = async function (action) {
    var btnPrint   = document.getElementById('btn-print-test');
    var btnPreview = document.getElementById('btn-preview-test');
    var btnDiag    = document.getElementById('btn-diag');

    if (action === 'print')   { if (btnPrint)   { btnPrint.disabled   = true; btnPrint.textContent   = '⏳ Envoi…'; } }
    if (action === 'preview') { if (btnPreview) { btnPreview.disabled = true; btnPreview.textContent = '⏳ Génération…'; } }
    if (action === 'diag')    { if (btnDiag)    { btnDiag.disabled    = true; btnDiag.textContent    = '⏳ Diagnostic (~30s)…'; } }
    setStatus('', true);

    try {
      if (action === 'preview') {
        var r = await fetch(BASE + 'api/print/preview/test');
        if (!r.ok) {
          var err = await safeJson(r);
          var msg = (err.parsed && (err.parsed.message || err.parsed.error)) || err.raw || ('Erreur ' + r.status);
          setStatus('Erreur : ' + msg, false);
          return;
        }
        var blob = await r.blob();
        document.getElementById('preview-img').src = URL.createObjectURL(blob);
        document.getElementById('preview-container').hidden = false;
        setStatus('Aperçu généré.', true);

      } else if (action === 'diag') {
        var r = await fetch(BASE + 'api/print/diag');
        var result = await safeJson(r);
        var container = document.getElementById('diag-result');
        var pre = document.getElementById('diag-pre');
        pre.textContent = JSON.stringify(result.parsed || result.raw, null, 2);
        container.hidden = false;
        if (result.parsed) {
          setStatus('Diagnostic terminé — copiez le résultat et envoyez-le.', true);
        } else {
          setStatus('Erreur serveur.', false);
        }

      } else {
        var r = await fetch(BASE + 'api/print/test', { method: 'POST' });
        var result = await safeJson(r);
        if (result.parsed) {
          var d = result.parsed;
          setStatus((d.ok ? '✅ ' : '❌ ') + (d.message || (d.ok ? 'Impression lancée !' : 'Erreur')), !!d.ok);
          window.showToast && window.showToast(d.message || (d.ok ? 'Impression lancée !' : 'Erreur'), d.ok ? 'ok' : 'error');
        } else {
          setStatus('Erreur serveur : ' + result.raw.slice(0, 120), false);
          window.showToast && window.showToast('Erreur serveur', 'error');
        }
      }
    } catch (e) {
      setStatus('Erreur réseau : ' + e.message, false);
    } finally {
      if (btnPrint)   { btnPrint.disabled   = false; btnPrint.textContent   = '🖨️ Imprimer une étiquette de test'; }
      if (btnPreview) { btnPreview.disabled = false; btnPreview.textContent = '👁 Prévisualiser'; }
      if (btnDiag)    { btnDiag.disabled    = false; btnDiag.textContent    = '🩺 Diagnostic BLE'; }
    }
  };
})();
</script>
